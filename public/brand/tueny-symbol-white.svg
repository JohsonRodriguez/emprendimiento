<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Tueny symbol">
<title>Tueny Symbol</title>
<defs>
  <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#11A36A"/>
    <stop offset="0.52" stop-color="#087A55"/>
    <stop offset="1" stop-color="#04543F"/>
  </linearGradient>
  <linearGradient id="gray" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#747B84"/>
    <stop offset="0.52" stop-color="#4B535D"/>
    <stop offset="1" stop-color="#252D36"/>
